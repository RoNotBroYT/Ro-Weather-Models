name: Verify

# Once a day: score the logged forecasts against yesterday's airport reports.
on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify.py
      - name: Save the scores
        run: |
          git config user.name "ro-weather-models"
          git config user.email "actions@users.noreply.github.com"
          git add logs/errors SCORES.md
          git commit -m "Scores $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase && git push
