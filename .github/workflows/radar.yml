name: Radar

# Draws the newest radar pictures into Backblaze B2 (bucket ro-weather-maps), so the
# website's paid server hardly draws radar. Started every 5 minutes by the
# Cloudflare Worker "ro-weather-radar-warm" (GitHub's own timer runs late).
on:
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  draw:
    # Five machines side by side: past radar frames, the forecast, satellite, lightning, charts (GFS).
    strategy:
      fail-fast: false
      matrix:
        part: [radar, forecast, sat, lightning, charts]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Draw and upload
        env:
          # Backblaze B2 (free, no card): uploads cost nothing.
          R2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          R2_REGION: us-east-005
          R2_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          R2_BUCKET: ro-weather-maps
          PART: ${{ matrix.part }}
          RW_PATIENT: "1"
          EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
          EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
        run: if [ "$PART" = charts ]; then bun charts.ts; else bun predraw.ts; fi

