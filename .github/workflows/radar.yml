name: Radar

# Draws the newest radar pictures into Backblaze B2 (bucket ro-weather-maps), so the
# website's paid server hardly draws radar. Started every 5 minutes by the
# Cloudflare Worker "ro-weather-radar-warm" (GitHub's own timer runs late).
on:
  workflow_dispatch:

# Each part has its own queue (19 Nov 2026): one shared queue made the radar wait for the
# slowest part (charts or satellite, ~7 min), so it fell 30 min behind. Now the radar part runs
# every 5 minutes whatever the others are doing; a part still busy just skips one turn.

jobs:
  draw:
    # Five machines side by side: past radar frames, the forecast, satellite, lightning, charts (GFS).
    strategy:
      fail-fast: false
      matrix:
        part: [radar, forecast, sat, lightning, charts]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: maps-${{ matrix.part }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Ground heights for rain / sleet / snow (25 Nov), fetched once and kept between runs.
      - uses: actions/cache@v4
        with:
          path: radar/dem-cache
          key: dem-v2
      # ecCodes reads DWD's ICON-EU files (rain / sleet / snow by wet-bulb, see lib/server/wetbulb.ts).
      - if: matrix.part == 'radar' || matrix.part == 'forecast'
        run: sudo apt-get install -y -qq libeccodes-tools > /dev/null
      - name: Draw and upload
        env:
          # Backblaze B2 (free, no card): uploads cost nothing.
          R2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          R2_REGION: us-east-005
          R2_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          R2_BUCKET: ro-weather-maps
          PART: ${{ matrix.part }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MAPS_PUT_KEY: ${{ secrets.MAPS_PUT_KEY }}
          CF_ACCOUNT_ID: dedc07a5683632eda32bc8dccda3ed43
          CF_KV_NS: c2451b6d00b548f78618402535d577f0
          RW_PATIENT: "1"
          EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
          EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
        run: if [ "$PART" = charts ]; then bun charts.ts; else bun predraw.ts; fi
      # Keep the site's next-hour rain service warm (owner, 19 Nov: the app's rain card waited 6 s
      # after a quiet spell; warm, it answers in about 0.5 s). One small request every 5 minutes.
      - if: matrix.part == 'radar'
        working-directory: .
        run: curl -s -o /dev/null -m 20 "https://www.ro-weather.app/api/rain-minute?lat=51.50&lon=-0.12" || true
