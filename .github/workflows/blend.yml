name: Blend

# Twice a day, once each ECMWF run (00z, 12z) is complete out to 10 days
# (about 7.5 h after the run), with the newest GFS and ICON-EU runs.
on:
  schedule:
    - cron: "15 8 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:

concurrency:
  group: blend
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  blend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Blend
        run: python blend.py out
      - name: Upload to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python upload.py out
      - name: Log the station forecasts
        run: |
          RUN=$(python -c "import json;print(json.load(open('out/meta.json'))['run'].replace(':',''))")
          mkdir -p logs/forecasts && cp out/stations.json "logs/forecasts/$RUN.json"
          git config user.name "ro-weather-models"
          git config user.email "actions@users.noreply.github.com"
          git add logs/forecasts
          git commit -m "Forecast log $RUN" || exit 0
          git pull --rebase && git push
