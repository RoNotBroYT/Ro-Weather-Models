name = "ro-weather-maps"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
B2_BUCKET = "ro-weather-maps"

[[routes]]
pattern = "radar.ro-weather.app"
custom_domain = true

# The small lists (what's ready, the chart run) and the shared Backblaze login (16 Nov).
[[kv_namespaces]]
binding = "LISTS"
id = "c2451b6d00b548f78618402535d577f0"

# The drawn map pictures (radar, forecast, satellite), packed 16x16 squares per row (17 Nov):
# Backblaze's free 2,500 downloads a day ran out. D1 free: 5 M rows read, 100 k written a day.
[[d1_databases]]
binding = "DB"
database_name = "ro-weather-tiles"
database_id = "8b12e116-2b44-45f2-a36a-cd730077bcf4"

# Free D1 holds 500 MB a database (5 GB in all), so the pictures are spread over eight:
# 0-1 radar, 2-3 forecast, 4-5 satellite, 6-7 charts (two each, by key). "DB" above is the first,
# full one, still read for the radar frames already in it until they expire.
[[d1_databases]]
binding = "T0"
database_name = "ro-weather-tiles-0"
database_id = "7953407e-f3a5-4a0d-8046-2e79b439c89d"

[[d1_databases]]
binding = "T1"
database_name = "ro-weather-tiles-1"
database_id = "58b9e8fc-a9af-45e6-b05f-568f3e8f806d"

[[d1_databases]]
binding = "T2"
database_name = "ro-weather-tiles-2"
database_id = "de7aa116-ad32-4baf-9bba-3dd03933b23d"

